name: Build Android-x86 9.0 + Linux-Surface ISO
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      android_x86_branch:
        description: 'Android-x86 分支'
        required: true
        default: 'pie-x86'
        type: choice
        options:
          - pie-x86
      surface_linux_branch:
        description: 'Linux-Surface 分支'
        required: true
        default: 'master'
        type: string
      kernel_version:
        description: '内核版本'
        required: true
        default: '4.19'
        type: choice
        options:
          - '4.19'
          - '5.4'
          - '5.10'
      enable_iptsd:
        description: '启用 IPTSD 触控/触笔支持'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_camera:
        description: '启用 Surface 相机支持'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      build_type:
        description: '编译类型'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - user
          - eng

schedule:
  - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_X86_BRANCH: ${{ github.event.inputs.android_x86_branch || 'pie-x86' }}
  SURFACE_LINUX_BRANCH: ${{ github.event.inputs.surface_linux_branch || 'master' }}
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '4.19' }}
  ENABLE_IPTSD: ${{ github.event.inputs.enable_iptsd || 'true' }}
  ENABLE_CAMERA: ${{ github.event.inputs.enable_camera || 'false' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'userdebug' }}
  ANDROID_SRC_DIR: ${{ github.workspace }}/android-src
  SURFACE_REPO_DIR: ${{ github.workspace }}/linux-surface
  OUT_DIR: ${{ github.workspace }}/out
  CCACHE_DIR: ${{ github.workspace }}/ccache
  JOBS: 8

jobs:
# ============================================================================
  preflight:
    name: "预检 & 环境验证"
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.set_tag.outputs.tag }}
      iso_name: ${{ steps.set_tag.outputs.iso_name }}
    steps:
      - name: 检查磁盘空间
        run: |
          echo "=== 磁盘空间 ==="
          df -h
          AVAIL=$(df --output=avail -BG / | tail -1 | tr -d 'G')
          if [ "${AVAIL}" -lt 80 ]; then
            echo "磁盘空间不足（需要 80GB，当前 ${AVAIL}GB）"
            exit 1
          fi
          echo "磁盘充足: ${AVAIL}GB"

      - name: 确定构建标签
        id: set_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$(date +'%Y%m%d')-${{ env.ANDROID_X86_BRANCH }}"
          fi
          ISO_NAME="android-x86_64-9.0-surface-${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "iso_name=${ISO_NAME}" >> "$GITHUB_OUTPUT"
          echo "构建标签: ${TAG}"
          echo "ISO 名称: ${ISO_NAME}"

      - name: 打印构建参数
        run: |
          echo "Android-x86 分支 : ${{ env.ANDROID_X86_BRANCH }}"
          echo "Linux-Surface 分支: ${{ env.SURFACE_LINUX_BRANCH }}"
          echo "内核版本        : ${{ env.KERNEL_VERSION }}"
          echo "IPTSD           : ${{ env.ENABLE_IPTSD }}"
          echo "相机            : ${{ env.ENABLE_CAMERA }}"
          echo "编译类型        : ${{ env.BUILD_TYPE }}"

# ============================================================================
  build:
    name: "编译 Android-x86 + Surface 驱动"
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 480
    steps:
      - name: 释放 GitHub Runner 磁盘空间
        run: |
          echo "释放前:"; df -h
          sudo apt-get remove -y \
            '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-chrome-stable firefox powershell mono-devel \
            libgl1-mesa-dri || true
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache /usr/local/.ghcup \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY" || true
          echo "释放后:"; df -h

      - name: 安装 AOSP 构建依赖 (兼容 Ubuntu 24.04)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git git-core curl wget \
            python3 python3-pip \
            openjdk-8-jdk-headless \
            bison flex gawk \
            gcc g++ g++-multilib gcc-multilib \
            make ninja-build cmake \
            libssl-dev libelf-dev libexpat1-dev \
            libc6-dev-i386 lib32z1-dev \
            libx11-dev libgl1-mesa-dev libxml2-utils \
            bc zip unzip rsync lzop cpio xz-utils \
            imagemagick xsltproc kmod dkms \
            squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin \
            dosfstools syslinux syslinux-common \
            mtools parted genisoimage isolinux \
            ccache build-essential

          sudo apt-get install -y libncurses-dev
          echo ">>> 安装 libncurses5 / libncursesw5 兼容库"
          ARCHIVE_BASE="http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses"
          wget -q "${ARCHIVE_BASE}/libtinfo5_6.2-0ubuntu2_amd64.deb" -O /tmp/tinfo5.deb
          wget -q "${ARCHIVE_BASE}/libncurses5_6.2-0ubuntu2_amd64.deb" -O /tmp/ncurses5.deb
          wget -q "${ARCHIVE_BASE}/libncursesw5_6.2-0ubuntu2_amd64.deb" -O /tmp/ncursesw5.deb
          sudo dpkg -i /tmp/tinfo5.deb /tmp/ncurses5.deb /tmp/ncursesw5.deb
          sudo apt-mark hold libtinfo5 libncurses5 libncursesw5

          sudo apt-get install -y lib32readline8-dev || \
            echo "lib32readline8-dev 不可用，忽略（不影响编译）"
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true
          echo "所有依赖安装完成"

      - name: 安装 repo 工具
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 配置 Git
        run: |
          git config --global user.email "ci@github-actions"
          git config --global user.name "GitHub Actions"
          git config --global color.ui false
          git config --global http.postBuffer 1073741824

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-x86-surface-${{ env.ANDROID_X86_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-x86-surface-${{ env.ANDROID_X86_BRANCH }}-
            ccache-android-x86-surface-

      - name: 配置 ccache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache --max-size=20G
          ccache --set-config=compiler_check=content
          ccache --set-config=cache_dir="${{ env.CCACHE_DIR }}"
          ccache --zero-stats
          echo "CCACHE_DIR=${{ env.CCACHE_DIR }}" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=$(which ccache)" >> "$GITHUB_ENV"

      - name: 初始化 repo manifest
        run: |
          mkdir -p "${{ env.ANDROID_SRC_DIR }}"
          cd "${{ env.ANDROID_SRC_DIR }}"
          repo init \
            --depth=1 \
            -u https://git.code.sf.net/p/android-x86/manifest \
            -b "${{ env.ANDROID_X86_BRANCH }}" \
            --no-clone-bundle \
            --no-tags

      - name: 同步源码（最多重试 3 次）
        run: |
          cd "${{ env.ANDROID_SRC_DIR }}"
          for ATTEMPT in 1 2 3; do
            echo "=== 同步尝试 ${ATTEMPT}/3 ==="
            if repo sync \
              --jobs="${{ env.JOBS }}" \
              --current-branch \
              --no-tags \
              --no-clone-bundle \
              --force-sync \
              --optimized-fetch; then
              echo "同步成功"
              break
            fi
            [ "${ATTEMPT}" -eq 3 ] && { echo "同步失败（已重试 3 次）"; exit 1; }
            echo "等待 30s 后重试..."
            sleep 30
          done
          echo "源码大小: $(du -sh . | cut -f1)"
          df -h

      - name: 克隆 Linux-Surface 仓库
        run: |
          git clone \
            --depth=1 \
            --branch "${{ env.SURFACE_LINUX_BRANCH }}" \
            https://github.com/linux-surface/linux-surface.git \
            "${{ env.SURFACE_REPO_DIR }}"
          echo "Linux-Surface 克隆完成"
          ls "${{ env.SURFACE_REPO_DIR }}/patches/" | head -20 || true

      - name: 定位内核源码目录
        run: |
          KERNEL_DIR="${{ env.ANDROID_SRC_DIR }}/kernel"
          if [ ! -f "${KERNEL_DIR}/Makefile" ]; then
            KERNEL_DIR=$(find "${{ env.ANDROID_SRC_DIR }}/kernel" -maxdepth 3 \
              -name "Makefile" 2>/dev/null | \
              xargs grep -l "^VERSION" 2>/dev/null | head -1 | xargs dirname || true)
          fi
          if [ -z "${KERNEL_DIR}" ] || [ ! -f "${KERNEL_DIR}/Makefile" ]; then
            echo "无法找到内核源码目录"
            find "${{ env.ANDROID_SRC_DIR }}" -maxdepth 4 -name "Makefile" | \
              xargs grep -l "^VERSION" 2>/dev/null | head -10 || true
            exit 1
          fi
          echo "内核目录: ${KERNEL_DIR}"
          echo "KERNEL_DIR=${KERNEL_DIR}" >> "$GITHUB_ENV"

      - name: 应用 Surface 内核补丁
        run: |
          KERNEL_DIR="${{ env.KERNEL_DIR }}"
          SURFACE_REPO="${{ env.SURFACE_REPO_DIR }}"
          PATCH_DIR=""
          for TRY_VER in "${{ env.KERNEL_VERSION }}" \
            "$(ls ${SURFACE_REPO}/patches/ | sort -V | tail -1)"; do
            CANDIDATE="${SURFACE_REPO}/patches/${TRY_VER}"
            if [ -d "${CANDIDATE}" ] && ls "${CANDIDATE}"/*.patch >/dev/null 2>&1; then
              PATCH_DIR="${CANDIDATE}"
              break
            fi
          done
          [ -z "${PATCH_DIR}" ] && PATCH_DIR="${SURFACE_REPO}/patches"
          echo "使用补丁目录: ${PATCH_DIR}"
          
          APPLIED=0; SKIPPED=0; FAILED=0
          for PATCH in $(ls "${PATCH_DIR}"/*.patch 2>/dev/null | sort); do
            NAME=$(basename "${PATCH}")
            printf " 应用 %s ... " "${NAME}"
            if git -C "${KERNEL_DIR}" apply --check "${PATCH}" 2>/dev/null; then
              if git -C "${KERNEL_DIR}" apply \
                --ignore-whitespace --ignore-space-change "${PATCH}" 2>/dev/null; then
                echo "OK"; APPLIED=$((APPLIED+1))
              else
                echo "FAIL"; FAILED=$((FAILED+1))
              fi
            elif git -C "${KERNEL_DIR}" apply \
              --3way --ignore-whitespace "${PATCH}" 2>/dev/null; then
              echo "OK(3way)"; APPLIED=$((APPLIED+1))
            else
              echo "SKIP"; SKIPPED=$((SKIPPED+1))
            fi
          done
          echo "补丁结果 — 成功:${APPLIED} 跳过:${SKIPPED} 失败:${FAILED}"
          [ "${FAILED}" -gt 2 ] && { echo "失败补丁过多，请检查版本兼容性"; exit 1; }

      - name: 集成 IPTSD 驱动
        if: env.ENABLE_IPTSD == 'true'
        run: |
          IPTSD_DIR="${{ env.KERNEL_DIR }}/drivers/hid/iptsd"
          SURFACE_REPO="${{ env.SURFACE_REPO_DIR }}"
          mkdir -p "${IPTSD_DIR}"
          if [ -d "${SURFACE_REPO}/module/iptsd" ]; then
            cp -r "${SURFACE_REPO}/module/iptsd/." "${IPTSD_DIR}/"
            echo "IPTSD: 从 linux-surface/module 复制"
          elif [ -d "${SURFACE_REPO}/kernel/drivers/hid/iptsd" ]; then
            cp -r "${SURFACE_REPO}/kernel/drivers/hid/iptsd/." "${IPTSD_DIR}/"
            echo "IPTSD: 从 linux-surface/kernel 复制"
          else
            printf '%s\n' \
              'config HID_IPTSD' \
              '  tristate "Microsoft Surface IPTSD touchscreen"' \
              '  depends on HID' \
              '  help' \
              '    Say Y here if you have a Microsoft Surface device with' \
              '    IPTSD (Integrated Pen and Touch) hardware.' \
              '    To compile this driver as a module, choose M here.' \
              > "${IPTSD_DIR}/Kconfig"
            printf '%s\n' \
              'obj-$(CONFIG_HID_IPTSD) += iptsd.o' \
              'iptsd-objs := context.o control.o devices.o hid.o touch.o stylus.o utils.o' \
              > "${IPTSD_DIR}/Makefile"
            echo "IPTSD: 使用占位驱动（需上游支持）"
          fi

      - name: 复制 Surface 固件文件
        run: |
          FIRMWARE_SRC="${{ env.SURFACE_REPO_DIR }}/firmware"
          FIRMWARE_DST="${{ env.ANDROID_SRC_DIR }}/vendor/firmware/surface"
          mkdir -p "${FIRMWARE_DST}"
          if [ -d "${FIRMWARE_SRC}" ]; then
            cp -r "${FIRMWARE_SRC}/." "${FIRMWARE_DST}/"
            echo "固件文件已复制: $(ls ${FIRMWARE_DST} | wc -l) 个"
          else
            echo "固件目录不存在（将在运行时从 linux-firmware 获取）"
          fi

      - name: 写入 Surface 内核配置片段
        run: |
          SURFACE_CONFIG="${{ env.SURFACE_REPO_DIR }}/configs/surface.config"
          if [ ! -f "${SURFACE_CONFIG}" ]; then
            SURFACE_CONFIG="/tmp/surface-fragment.config"
            printf '%s\n' \
              '# Surface Platform / ACPI' \
              'CONFIG_SURFACE_3_POWER_OPREGION=m' \
              'CONFIG_SURFACE_ACPI_NOTIFY=m' \
              'CONFIG_SURFACE_AGGREGATOR=m' \
              'CONFIG_SURFACE_AGGREGATOR_BUS=m' \
              'CONFIG_SURFACE_AGGREGATOR_REGISTRY=m' \
              'CONFIG_SURFACE_AGGREGATOR_HUB=m' \
              '# Surface HID / Input' \
              'CONFIG_SURFACE_HID=m' \
              'CONFIG_SURFACE_KBD=m' \
              'CONFIG_SURFACE_BUTTON=m' \
              '# IPTSD' \
              'CONFIG_HID_IPTSD=m' \
              'CONFIG_INPUT_TOUCHSCREEN=y' \
              'CONFIG_TOUCHSCREEN_IPTS=m' \
              'CONFIG_TOUCHSCREEN_SURFACE3_SPI=m' \
              '# Camera (IPU3)' \
              'CONFIG_VIDEO_IPU3_CIO2=m' \
              'CONFIG_VIDEO_IPU3_IMGU=m' \
              '# WiFi' \
              'CONFIG_IWLMVM=m' \
              'CONFIG_IWLDVM=m' \
              'CONFIG_IWLWIFI=m' \
              'CONFIG_IWLWIFI_LEDS=y' \
              '# Bluetooth' \
              'CONFIG_BT_HCIBTUSB=m' \
              'CONFIG_BT_INTEL=m' \
              '# NVMe' \
              'CONFIG_BLK_DEV_NVME=y' \
              'CONFIG_NVME_CORE=y' \
              'CONFIG_NVME_MULTIPATH=y' \
              '# USB Type-C' \
              'CONFIG_TYPEC=m' \
              'CONFIG_TYPEC_UCSI=m' \
              'CONFIG_USB_ROLES_INTEL_XHCI=m' \
              '# Surface Battery' \
              'CONFIG_BATTERY_SURFACE=m' \
              'CONFIG_CHARGER_SURFACE=m' \
              'CONFIG_SURFACE_PLATFORM_PROFILE=m' \
              'CONFIG_INTEL_IPTS=m' \
              'CONFIG_SURFACE_DOCK=m' \
              '# HID Sensors' \
              'CONFIG_HID_MULTITOUCH=m' \
              'CONFIG_HID_SENSOR_HUB=m' \
              'CONFIG_HID_SENSOR_ACCEL_3D=m' \
              'CONFIG_HID_SENSOR_GYRO_3D=m' \
              'CONFIG_HID_SENSOR_ALS=m' \
              '# Power management' \
              'CONFIG_ACPI_BUTTON=y' \
              'CONFIG_ACPI_VIDEO=m' \
              'CONFIG_ACPI_FAN=m' \
              'CONFIG_ACPI_THERMAL=m' \
              'CONFIG_INTEL_IDLE=y' \
              'CONFIG_CPU_FREQ_GOV_POWERSAVE=y' \
              'CONFIG_CPU_FREQ_GOV_USERSPACE=y' \
              'CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y' \
              '# PCIe' \
              'CONFIG_PCIE_DW=y' \
              'CONFIG_PCIE_DW_HOST=y' \
              '# Audio' \
              'CONFIG_SND_SOC_INTEL_SKL=m' \
              'CONFIG_SND_SOC_INTEL_KBL=m' \
              'CONFIG_SND_SOC_INTEL_GLK=m' \
              'CONFIG_SND_SOC_INTEL_CNL=m' \
              'CONFIG_SND_SOC_INTEL_ICL=m' \
              'CONFIG_SND_SOC_RT5651=m' \
              'CONFIG_SND_SOC_RT5663=m' \
              'CONFIG_SND_SOC_DA7219=m' \
              'CONFIG_SND_SOC_MAX98927=m' \
              'CONFIG_SND_SOC_MAX98373=m' \
              > "${SURFACE_CONFIG}"
          fi
          echo "SURFACE_CONFIG=${SURFACE_CONFIG}" >> "$GITHUB_ENV"
          echo "配置行数: $(grep -cv '^#' ${SURFACE_CONFIG} || true)"

      - name: 合并内核配置
        run: |
          KERNEL_DIR="${{ env.KERNEL_DIR }}"
          KERNEL_OUT="${{ env.OUT_DIR }}/kernel"
          mkdir -p "${KERNEL_OUT}"
          cd "${KERNEL_DIR}"
          make ARCH=x86_64 O="${KERNEL_OUT}" android-x86_64_defconfig
          if [ -f "scripts/kconfig/merge_config.sh" ]; then
            KCONFIG_CONFIG="${KERNEL_OUT}/.config" ARCH=x86_64 \
              bash scripts/kconfig/merge_config.sh \
              -m "${KERNEL_OUT}/.config" "${{ env.SURFACE_CONFIG }}"
          else
            cat "${{ env.SURFACE_CONFIG }}" >> "${KERNEL_OUT}/.config"
          fi
          make ARCH=x86_64 O="${KERNEL_OUT}" olddefconfig
          echo "=== 关键配置验证 ==="
          for CFG in CONFIG_HID_IPTSD CONFIG_SURFACE_AGGREGATOR \
                     CONFIG_IWLWIFI CONFIG_BLK_DEV_NVME; do
            VAL=$(grep "^${CFG}=" "${KERNEL_OUT}/.config" 2>/dev/null || echo "未设置")
            echo "  ${CFG} = ${VAL}"
          done

      - name: 创建 Surface Android 设备配置
        run: |
          DEVICE_DIR="${{ env.ANDROID_SRC_DIR }}/device/surface/x86_64"
          mkdir -p "${DEVICE_DIR}"
          printf '%s\n' \
            'LOCAL_PATH := $(call my-dir)' \
            'include $(CLEAR_VARS)' \
            > "${DEVICE_DIR}/Android.mk"
          {
            echo '# Surface x86_64 设备配置'
            echo 'PRODUCT_NAME := android_x86_64_surface'
            echo 'PRODUCT_DEVICE := x86_64_surface'
            echo 'PRODUCT_BRAND := Surface'
            echo 'PRODUCT_MODEL := Microsoft Surface (Android-x86)'
            echo 'PRODUCT_MANUFACTURER := Microsoft'
            echo '$(call inherit-product, device/generic/x86_64/device.mk)'
            echo 'PRODUCT_COPY_FILES += \'
            echo '  $(LOCAL_PATH)/iptsd.idc:$(TARGET_COPY_OUT_SYSTEM)/usr/idc/iptsd.idc \'
            echo '  $(LOCAL_PATH)/surface_init.rc:$(TARGET_COPY_OUT_SYSTEM)/etc/init/surface_init.rc \'
            echo '  frameworks/native/data/etc/android.hardware.wifi.xml:$(TARGET_COPY_OUT_SYSTEM)/etc/permissions/android.hardware.wifi.xml \'
            echo '  frameworks/native/data/etc/android.hardware.touchscreen.multitouch.jazzhand.xml:$(TARGET_COPY_OUT_SYSTEM)/etc/permissions/android.hardware.touchscreen.multitouch.jazzhand.xml \'
            echo '  frameworks/native/data/etc/android.hardware.bluetooth.xml:$(TARGET_COPY_OUT_SYSTEM)/etc/permissions/android.hardware.bluetooth.xml \'
            echo '  frameworks/native/data/etc/android.hardware.usb.host.xml:$(TARGET_COPY_OUT_SYSTEM)/etc/permissions/android.hardware.usb.host.xml \'
            echo '  frameworks/native/data/etc/android.hardware.sensor.accelerometer.xml:$(TARGET_COPY_OUT_SYSTEM)/etc/permissions/android.hardware.sensor.accelerometer.xml'
            echo 'PRODUCT_AAPT_CONFIG := xlarge'
            echo 'PRODUCT_AAPT_PREF_CONFIG := xhdpi'
            echo 'PRODUCT_CHARACTERISTICS := tablet'
            echo 'PRODUCT_PROPERTY_OVERRIDES += \'
            echo '  ro.sf.lcd_density=192 \'
            echo '  persist.sys.timezone=Asia/Shanghai'
          } > "${DEVICE_DIR}/device.mk"
          printf '%s\n' \
            'device.internal = 1' \
            'touch.deviceType = touchScreen' \
            'touch.orientationAware = 1' \
            'touch.size.calibration = diameter' \
            'touch.pressure.calibration = amplitude' \
            'touch.pressure.scale = 0.013' \
            > "${DEVICE_DIR}/iptsd.idc"
          printf '%s\n' \
            '# Surface 初始化脚本' \
            'on property:sys.boot_completed=1' \
            '  exec /system/bin/modprobe surface_aggregator' \
            '  exec /system/bin/modprobe surface_hid' \
            '  exec /system/bin/modprobe hid_iptsd' \
            '  chmod 0666 /dev/input/event0' \
            '  chown system system /dev/input/event0' \
            '  setprop vendor.wifi.firmware /vendor/firmware' \
            > "${DEVICE_DIR}/surface_init.rc"
          echo "Surface 设备配置创建完成"
          ls -la "${DEVICE_DIR}"

      - name: 完整系统编译
        run: |
          cd "${{ env.ANDROID_SRC_DIR }}"
          source build/envsetup.sh
          lunch android_x86_64-${{ env.BUILD_TYPE }}
          echo "TARGET_PRODUCT       : ${TARGET_PRODUCT}"
          echo "TARGET_BUILD_VARIANT : ${TARGET_BUILD_VARIANT}"
          df -h .
          make -j${{ env.JOBS }} iso_img \
            TARGET_PRODUCT=android_x86_64 \
            TARGET_BUILD_VARIANT=${{ env.BUILD_TYPE }} \
            2>&1 | tee /tmp/build.log
          BUILD_EC=$?
          if [ "${BUILD_EC}" -ne 0 ]; then
            echo "编译失败 (exit ${BUILD_EC})"
            tail -100 /tmp/build.log
            exit 1
          fi
          echo "编译成功"

      - name: 定位 ISO 并生成校验和
        run: |
          cd "${{ env.ANDROID_SRC_DIR }}"
          ISO_SRC=$(find . -name "*.iso" -newer build/envsetup.sh 2>/dev/null | head -1)
          [ -z "${ISO_SRC}" ] && \
            ISO_SRC=$(find out/target/product -name "android_x86_64.iso" 2>/dev/null | head -1)
          if [ -z "${ISO_SRC}" ]; then
            echo "未找到 ISO 文件"
            find out/ -name "*.iso" 2>/dev/null || echo "out/ 中无 ISO"
            exit 1
          fi
          echo "找到 ISO: ${ISO_SRC} ($(du -sh ${ISO_SRC} | cut -f1))"
          ISO_NAME="${{ needs.preflight.outputs.iso_name }}"
          ISO_FINAL="${{ env.OUT_DIR }}/${ISO_NAME}.iso"
          mkdir -p "${{ env.OUT_DIR }}"
          cp "${ISO_SRC}" "${ISO_FINAL}"
          sha256sum "${ISO_FINAL}" > "${ISO_FINAL}.sha256"
          echo "SHA256: $(cat ${ISO_FINAL}.sha256)"
          echo "ISO_FINAL=${ISO_FINAL}" >> "$GITHUB_ENV"
          echo "ISO_NAME=${ISO_NAME}" >> "$GITHUB_ENV"

      - name: 上传 ISO 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.iso_name }}
          path: |
            ${{ env.OUT_DIR }}/${{ needs.preflight.outputs.iso_name }}.iso
            ${{ env.OUT_DIR }}/${{ needs.preflight.outputs.iso_name }}.iso.sha256
          retention-days: 7
          compression-level: 0

      - name: ccache 统计
        if: always()
        run: ccache --show-stats

# ============================================================================
  release:
    name: "发布 GitHub Release"
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && needs.build.result == 'success')
    permissions:
      contents: write
    steps:
      - name: 下载编译产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.iso_name }}
          path: ./release-files

      - name: 验证产物完整性
        run: |
          ls -lh ./release-files/
          cd ./release-files
          ISO_FILE=$(ls *.iso | head -1)
          SHA_FILE="${ISO_FILE}.sha256"
          [ -f "${SHA_FILE}" ] && sha256sum -c "${SHA_FILE}"
          echo "ISO 大小: $(du -sh ${ISO_FILE} | cut -f1)"

      - name: 生成 Release 发布说明
        run: |
          TAG="${{ needs.preflight.outputs.build_tag }}"
          ISO="${{ needs.preflight.outputs.iso_name }}"
          SHA=$(cat "./release-files/${ISO}.iso.sha256" 2>/dev/null || echo "见附件")
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M UTC')
          {
            echo "## Android-x86 9.0 + Linux-Surface · ${TAG}"
            echo ""
            echo "### 包含内容"
            echo "- 基础系统: Android-x86 9.0 (${{ env.ANDROID_X86_BRANCH }})"
            echo "- Surface 补丁: linux-surface/${{ env.SURFACE_LINUX_BRANCH }}"
            echo "- 内核版本: Linux ${{ env.KERNEL_VERSION }}.x (with Surface patches)"
            echo "- 编译类型: ${{ env.BUILD_TYPE }}"
            echo "- IPTSD 触控: ${{ env.ENABLE_IPTSD }}"
            echo "- 相机支持: ${{ env.ENABLE_CAMERA }}"
            echo ""
            echo "### 支持的 Surface 型号"
            echo "| 型号 | 状态 | 备注 |"
            echo "|------|------|------|"
            echo "| Surface Pro 3 | 部分 | 触控笔不完整 |"
            echo "| Surface Pro 4 | 良好 | 触控/键盘正常 |"
            echo "| Surface Pro 5 (2017) | 良好 | |"
            echo "| Surface Pro 6 | 良好 | |"
            echo "| Surface Pro 7 | 部分 | 相机需额外配置 |"
            echo "| Surface Laptop 1/2/3 | 良好 | |"
            echo "| Surface Book 1/2 | 部分 | GPU 切换受限 |"
            echo "| Surface Go 1/2 | 良好 | |"
            echo ""
            echo "### 安装方法"
            echo "1. 下载 \`${ISO}.iso\`"
            echo "2. 写入 U 盘:"
            echo ' ```bash'
            echo "    sudo dd if=${ISO}.iso of=/dev/sdX bs=4M status=progress"
            echo ' ```'
            echo "3. 从 U 盘启动，选择 Install 或 Live CD 模式"
            echo ""
            echo "### SHA256"
            echo '```'
            echo "${SHA}"
            echo '```'
            echo ""
            echo "### 已知问题"
            echo "- Surface Pro 7+ 触控笔可能需要 iptsd 用户空间守护进程"
            echo "- 相机（ISP）支持仍处于实验阶段"
            echo "- 休眠/唤醒在部分型号上可能不稳定"
            echo ""
            echo "---"
            echo "构建时间: ${BUILD_TIME}"
            echo "构建 SHA: ${{ github.sha }}"
          } > /tmp/release_notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.build_tag }}
          name: "Android-x86 9.0 + Surface · ${{ needs.preflight.outputs.build_tag }}"
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ env.BUILD_TYPE != 'user' }}
          files: |
            ./release-files/${{ needs.preflight.outputs.iso_name }}.iso
            ./release-files/${{ needs.preflight.outputs.iso_name }}.iso.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ============================================================================
  notify:
    name: "构建摘要"
    runs-on: ubuntu-latest
    needs: [preflight, build, release]
    if: always()
    steps:
      - name: 写入 Job Summary
        run: |
          {
            echo "## 构建摘要"
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 构建标签 | ${{ needs.preflight.outputs.build_tag }} |"
            echo "| Android-x86 分支 | ${{ env.ANDROID_X86_BRANCH }} |"
            echo "| Surface 分支 | ${{ env.SURFACE_LINUX_BRANCH }} |"
            echo "| 内核版本 | ${{ env.KERNEL_VERSION }} |"
            echo "| 编译状态 | ${{ needs.build.result }} |"
            echo "| 发布状态 | ${{ needs.release.result }} |"
            echo "| ISO 文件名 | ${{ needs.preflight.outputs.iso_name }}.iso |"
          } >> "$GITHUB_STEP_SUMMARY"
